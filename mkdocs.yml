site_name: SPECial
site_description: A specification / documentation standard for spec-driven development
repo_url: https://github.com/theoryzhenkov/SPECial
repo_name: theoryzhenkov/SPECial

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Files: files/L0-files.md
  - File Contracts: files/L1-files.md
  - File Structure: files/L2-files.md
  - Assertions: files/L1-files-assertions.md
  - Assertion Format: files/L2-files-assertions.md
  - Documentation Style: L0-documentation-style.md
  - Tooling: L0-tooling.md
  - Divergence: L0-divergence.md
  - Agent Reference Sentinel: L3-agent-reference.md
  - Agent Setup: agent-setup.md
